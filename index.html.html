<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>王豆豆的专属订单 · 在线点单</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f2f4;color:#1a1a1a;display:flex;align-items:center;justify-content:center;}
button,input{font:inherit;}
#app{width:100%;max-width:400px;height:100vh;max-height:900px;background:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 0 40px rgba(0,0,0,.08);}
@media(min-width:480px){#app{height:820px;border-radius:16px;border:1px solid #e2e2e6;}}
.tabbar{display:flex;border-top:1px solid #ececf0;height:56px;background:#fff;}
.tabbar button{flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#9a9aa2;font-size:12px;}
.tabbar button.on{color:#1a1a1a;font-weight:500;}
.hd{padding:14px 16px 8px;border-bottom:1px solid #ececf0;background:#fff;}
.search{display:flex;align-items:center;gap:8px;background:#f4f4f6;border-radius:10px;padding:8px 12px;margin-top:10px;color:#9a9aa2;}
.search input{border:0;background:none;outline:none;flex:1;color:#1a1a1a;font-size:14px;}
.search input::placeholder{color:#b8b8c0;}
.menu{display:flex;flex:1;min-height:0;}
.cats{width:96px;overflow-y:auto;border-right:1px solid #ececf0;background:#f7f7f9;flex:none;}
.cats button{display:block;width:100%;border:0;background:none;text-align:left;padding:14px 12px;font-size:14px;color:#66666e;cursor:pointer;position:relative;}
.cats button.on{background:#fff;color:#1a1a1a;font-weight:500;}
.cats button.on::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:#1a1a1a;}
.dishes{flex:1;overflow-y:auto;padding:8px 12px 16px;background:#fff;}
.dish{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f3;}
.dish:last-child{border-bottom:0;}
.thumb{width:64px;height:64px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500;flex:none;}
.dname{font-size:15px;font-weight:500;}
.desc{font-size:12px;color:#9a9aa2;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px;}
.sales{font-size:12px;color:#b8b8c0;margin-top:2px;}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px;}
.row2{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.price{font-weight:500;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.price small{font-size:12px;}
.stepper{display:flex;align-items:center;gap:8px;}
.stepper button{width:24px;height:24px;border-radius:50%;border:1px solid #dcdce2;background:none;cursor:pointer;color:#1a1a1a;display:flex;align-items:center;justify-content:center;padding:0;}
.stepper .add{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.qty{min-width:16px;text-align:center;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;}
.cartbar{margin:8px 12px;border-radius:12px;background:#1a1a1a;color:#fff;display:flex;align-items:center;padding:8px 12px;gap:12px;}
.cartbar .ci{position:relative;cursor:pointer;}
.badge{position:absolute;top:-6px;right:-8px;background:#e5484d;color:#fff;font-size:11px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.go{margin-left:auto;border:0;border-radius:8px;background:#fff;color:#1a1a1a;font-weight:500;padding:8px 16px;cursor:pointer;font-size:14px;}
.go:disabled{opacity:.4;cursor:default;}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;}
.sheet{width:100%;background:#fff;border-radius:12px 12px 0 0;max-height:70%;display:flex;flex-direction:column;}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #ececf0;font-weight:500;}
.sheet-b{overflow-y:auto;padding:4px 16px 16px;}
.citem{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0f0f3;font-size:14px;}
.citem:last-child{border-bottom:0;}
.clink{border:0;background:none;color:#9a9aa2;font-size:12px;cursor:pointer;}
.totline{display:flex;justify-content:space-between;font-size:13px;color:#66666e;padding:6px 0;}
.bigbtn{width:100%;border:0;border-radius:10px;background:#1a1a1a;color:#fff;font-weight:500;padding:12px;cursor:pointer;margin-top:8px;font-size:15px;}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:#1a1a1a;color:#fff;border-radius:10px;padding:10px 20px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
.page{flex:1;min-height:0;overflow-y:auto;display:none;background:#fff;}
.page.on{display:block;}
.ocard{margin:12px;border:1px solid #ececf0;border-radius:12px;padding:12px;}
.pill{font-size:11px;padding:2px 8px;border-radius:6px;}
.orow{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#66666e;padding:2px 0;}
.ghost{border:1px solid #dcdce2;background:none;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;color:#1a1a1a;}
.me-h{padding:20px 16px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #ececf0;}
.avatar{width:48px;height:48px;border-radius:50%;background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
.mrow{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #f0f0f3;font-size:14px;cursor:pointer;}
.mrow span{margin-left:auto;color:#b8b8c0;font-size:13px;}
.empty{text-align:center;color:#b8b8c0;padding:48px 0;font-size:13px;line-height:1.8;}
.eview{flex:1;min-height:0;overflow-y:auto;display:none;padding:12px 16px 16px;background:#fff;}
.eview.on{display:block;}
.einput{width:100%;border:1px solid #dcdce2;border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;color:#1a1a1a;outline:none;}
.einput:focus{border-color:#1a1a1a;}
.elab{font-size:12px;color:#9a9aa2;margin:10px 0 4px;}
.ebtn{border:1px solid #dcdce2;background:#fff;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:#1a1a1a;}
.edel{border:0;background:none;color:#b8b8c0;cursor:pointer;font-size:12px;flex:none;}
.ecard{border:1px solid #ececf0;border-radius:12px;padding:12px;margin-bottom:12px;}
.edish{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;margin-top:8px;padding-top:8px;border-top:1px dashed #dcdce2;align-items:center;}
</style>
</head>
<body>
<div id="app">

<div class="hd">
  <div style="display:flex;justify-content:space-between;align-items:baseline;">
    <div style="font-size:17px;font-weight:500;" id="stName">王豆豆的专属订单</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="font-size:12px;color:#9a9aa2;">桌号 <span id="stTable">A12</span></div>
      <button class="ebtn" id="editBtn">编辑内容</button>
    </div>
  </div>
  <div style="font-size:12px;color:#9a9aa2;margin-top:4px;"><span style="color:#f0a020;">★★★★★</span> 4.8 ｜ 起送¥20 ｜ 配送约30分钟</div>
  <div class="search" id="searchWrap"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M11.5 3C16.1944 3 20 6.80558 20 11.5C20 13.523 19.2933 15.381 18.1132 16.8404L21.1364 19.8636C21.4879 20.2151 21.4879 20.7849 21.1364 21.1364C20.7849 21.4879 20.2151 21.4879 19.8636 21.1364L16.8404 18.1132C15.381 19.2933 13.523 20 11.5 20C6.80558 20 3 16.1944 3 11.5C3 6.80558 6.80558 3 11.5 3ZM11.5 18.2C15.2003 18.2 18.2 15.2003 18.2 11.5C18.2 7.79969 15.2003 4.8 11.5 4.8C7.79969 4.8 4.8 7.79969 4.8 11.5C4.8 15.2003 7.79969 18.2 11.5 18.2Z"/></svg><input id="kw" placeholder="搜索菜品"><span id="kwclear" style="display:none;cursor:pointer;"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M17.9542 4.77253C18.3056 4.42106 18.8761 4.42106 19.2276 4.77253C19.579 5.12401 19.579 5.69452 19.2276 6.04597L13.2735 12.0001L19.2276 17.9542C19.5791 18.3056 19.5791 18.8761 19.2276 19.2276C18.8761 19.5791 18.3056 19.5791 17.9542 19.2276L12.0001 13.2735L6.04595 19.2276C5.69451 19.5791 5.12399 19.579 4.77252 19.2276C4.42104 18.8761 4.42104 18.3056 4.77252 17.9542L10.7266 12.0001L4.77252 6.04597C4.42104 5.6945 4.42104 5.124 4.77252 4.77253C5.12399 4.42107 5.69448 4.42106 6.04595 4.77253L12.0001 10.7266L17.9542 4.77253Z"/></svg></span></div>
</div>

<div id="pgMenu" class="page on">
  <div class="menu" id="menuView">
    <div class="cats" id="cats"></div>
    <div class="dishes" id="dishes"></div>
  </div>
  <div class="eview" id="editView"></div>
</div>

<div id="pgOrders" class="page"><div id="orders"></div></div>

<div id="pgMe" class="page">
  <div class="me-h"><div class="avatar">豆</div><div><div style="font-weight:500;">王豆豆</div><div style="font-size:12px;color:#9a9aa2;margin-top:2px;">尊贵的店主大人 ｜ 积分 999</div></div></div>
  <div class="mrow">我的地址<span>家和街12号 ›</span></div>
  <div class="mrow">优惠券<span>3 张可用 ›</span></div>
  <div class="mrow">发票助手<span>›</span></div>
  <div class="mrow">联系客服<span>在线 ›</span></div>
</div>

<div class="cartbar" id="cartbar">
  <div class="ci"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h2l2.3 10.5h10.5l2.1-7.6H7"/><circle cx="10" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg><span class="badge" id="badge" style="display:none;">0</span></div>
  <div><div class="price" style="font-size:17px;" id="ctotal">¥0</div><div style="font-size:11px;opacity:.7;" id="cnote">另需打包费¥2</div></div>
  <button class="go" id="goBtn">去结算</button>
</div>

<div class="tabbar">
  <button class="on" data-pg="pgMenu"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M4.09998 5.99998C4.09998 5.50292 4.50292 5.09998 4.99998 5.09998H19C19.497 5.09998 19.9 5.50292 19.9 5.99998C19.9 6.49703 19.497 6.89998 19 6.89998H4.99998C4.50292 6.89998 4.09998 6.49703 4.09998 5.99998ZM4.09998 12C4.09998 11.5029 4.50292 11.1 4.99998 11.1H13C13.497 11.1 13.9 11.5029 13.9 12C13.9 12.497 13.497 12.9 13 12.9H4.99998C4.50292 12.9 4.09998 12.497 4.09998 12ZM4.09998 18C4.09998 17.5029 4.50292 17.1 4.99998 17.1H13C13.497 17.1 13.9 17.5029 13.9 18C13.9 18.497 13.497 18.9 13 18.9H4.99998C4.50292 18.9 4.09998 18.497 4.09998 18Z"/></svg>点单</button>
  <button data-pg="pgOrders"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 1.89893C17.4677 1.89893 21.9001 6.33147 21.9002 11.7991C21.9002 17.2669 17.4678 21.6993 12 21.6993C6.53228 21.6993 2.09985 17.2669 2.09985 11.7991C2.09998 6.33147 6.53236 1.89893 12 1.89893ZM20.1 11.7998C20.1 7.32616 16.4737 3.69984 12 3.69984C7.5264 3.69984 3.90008 7.32616 3.90008 11.7998C3.90032 16.2732 7.52655 19.8998 12 19.8998C16.4735 19.8998 20.0998 16.2732 20.1 11.7998Z"/><path d="M11.8999 6.79965C12.397 6.79965 12.7997 7.20235 12.7997 7.69941V11.7266L14.7359 13.6629C15.0873 14.0143 15.0879 14.584 14.7366 14.9355C14.3852 15.287 13.8148 15.287 13.4633 14.9355L11.2632 12.7355C11.0947 12.5668 11.0002 12.338 11.0001 12.0995V7.69941C11.0001 7.20238 11.4029 6.7997 11.8999 6.79965Z"/></svg>订单</button>
  <button data-pg="pgMe"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M11.9997 12.8779C16.0197 12.878 19.4393 15.3848 20.7048 18.8828C21.0812 19.9234 20.2782 20.8962 19.2038 21.0137L18.9861 21.0264H5.0134L4.79562 21.0137C3.7213 20.8961 2.91743 19.9233 3.29367 18.8828C4.55905 15.3847 7.9797 12.8781 11.9997 12.8779ZM11.9997 14.6777C8.84467 14.6779 6.17462 16.5794 5.09152 19.2256H18.9079C17.8248 16.5793 15.1549 14.6778 11.9997 14.6777ZM12.2312 3.00586C14.6088 3.1264 16.4997 5.09239 16.4997 7.5L16.4939 7.73145C16.3734 10.1091 14.4073 11.9999 11.9997 12C9.59225 11.9998 7.62604 10.109 7.50558 7.73145L7.49973 7.5C7.49973 5.01485 9.51462 3.00021 11.9997 3L12.2312 3.00586Z"/></svg>我的</button>
</div>

<div id="overlay" style="display:none;"></div>
<div class="toast" id="toast"></div>
</div>

<script>
/* ========= 数据（默认） ========= */
const DEFAULTS={
  store:{name:'王豆豆的专属订单',table:'A12'},
  CATS:[{id:'c1',n:'网络一线牵'},{id:'c2',n:'线下碰一碰'},{id:'c3',n:'吃撑巨人观'},{id:'c4',n:'待开发项目'}],
  DISHES:[
    {id:1,c:'c1',n:'菜品1',d:'点击右上角「编辑内容」修改',p:15.8,s:0,t:'',h:1},
    {id:2,c:'c1',n:'菜品2',d:'点击右上角「编辑内容」修改',p:22.8,s:0,t:'',h:2},
    {id:3,c:'c2',n:'菜品1',d:'点击右上角「编辑内容」修改',p:18.8,s:0,t:'',h:3},
    {id:4,c:'c2',n:'菜品2',d:'点击右上角「编辑内容」修改',p:26.8,s:0,t:'',h:4},
    {id:5,c:'c3',n:'菜品1',d:'点击右上角「编辑内容」修改',p:32.8,s:0,t:'',h:2},
    {id:6,c:'c3',n:'菜品2',d:'点击右上角「编辑内容」修改',p:38.8,s:0,t:'',h:5},
    {id:7,c:'c4',n:'菜品1',d:'点击右上角「编辑内容」修改',p:9.9,s:0,t:'',h:1},
    {id:8,c:'c4',n:'菜品2',d:'点击右上角「编辑内容」修改',p:12.8,s:0,t:'',h:3}
  ],
  orders:[]
};
const LS_KEY='wdd_order_v1';
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify({store,CATS,DISHES,orders}));}catch(e){}}
function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return false;
    const d=JSON.parse(raw);
    store.name=d.store&&d.store.name||DEFAULTS.store.name;
    store.table=d.store&&d.store.table||DEFAULTS.store.table;
    CATS=d.CATS&&d.CATS.length?d.CATS:DEFAULTS.CATS.slice();
    DISHES=d.DISHES&&d.DISHES.length?d.DISHES:DEFAULTS.DISHES.slice();
    orders=d.orders||[];
    return true;
  }catch(e){return false;}
}

let store={name:DEFAULTS.store.name,table:DEFAULTS.store.table};
let CATS=[],DISHES=[],orders=[];
load();
let cart={},curCat=CATS.length?CATS[0].id:'',kw='',editMode=false,dishSeq=100;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;');
const icoPlus='<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 6.09961C12.4971 6.09961 12.9004 6.50294 12.9004 7V11.0996H17C17.4971 11.0996 17.9004 11.5029 17.9004 12C17.9004 12.4971 17.4971 12.9004 17 12.9004H12.9004V17C12.9004 17.4971 12.4971 17.9004 12 17.9004C11.5029 17.9004 11.0996 17.4971 11.0996 17V12.9004H7C6.50294 12.9004 6.09961 12.4971 6.09961 12C6.09961 11.5029 6.50294 11.0996 7 11.0996H11.0996V7C11.0996 6.50294 11.5029 6.09961 12 6.09961Z"/></svg>';
const icoMinus='<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17 11.0996C17.4971 11.0996 17.9004 11.5029 17.9004 12C17.9004 12.4971 17.4971 12.9004 17 12.9004H7C6.50294 12.9004 6.09961 12.4971 6.09961 12C6.09961 11.5029 6.50294 11.0996 7 11.0996H17Z"/></svg>';
const HUES=['','#3d7fff','#e5484d','#30a46c','#8e4ec6','#8b8d98'];
const TAGC={'招牌':['#e5484d','rgba(229,72,77,.10)'],'店长推荐':['#e5484d','rgba(229,72,77,.10)'],'热销':['#b47909','rgba(240,160,32,.14)'],'热卖':['#b47909','rgba(240,160,32,.14)']};

function dishCard(d){
  const q=cart[d.id]||0;
  const tg=d.t&&TAGC[d.t]?'<span class="tag" style="color:'+TAGC[d.t][0]+';background:'+TAGC[d.t][1]+';">'+esc(d.t)+'</span>':'';
  const step=q===0
    ?'<button class="add" style="width:28px;height:28px;" onclick="chg('+d.id+',1)">'+icoPlus+'</button>'
    :'<div class="stepper"><button onclick="chg('+d.id+',-1)">'+icoMinus+'</button><span class="qty">'+q+'</span><button class="add" onclick="chg('+d.id+',1)">'+icoPlus+'</button></div>';
  const sales=Number(d.s)>0?'<div class="sales">月售 '+d.s+' ｜ 好评率 98%</div>':'';
  return '<div class="dish"><div class="thumb" style="color:'+HUES[d.h%6]+';background:'+HUES[d.h%6]+'1f;">'+esc(d.n[0]||'菜')+'</div><div style="flex:1;min-width:0;"><div class="dname">'+esc(d.n)+tg+'</div><div class="desc">'+esc(d.d)+'</div>'+sales+'<div class="row2"><div class="price">¥<small>'+Number(d.p).toFixed(1)+'</small></div>'+step+'</div></div></div>';
}
function renderCats(){
  $('cats').innerHTML=CATS.map(c=>'<button class="'+(c.id===curCat&&!kw?'on':'')+'" onclick="setCat(\''+c.id+'\')">'+esc(c.n)+'</button>').join('');
}
function renderDishes(){
  const list=kw?DISHES.filter(d=>d.n.includes(kw)||(d.d||'').includes(kw)):DISHES.filter(d=>d.c===curCat);
  $('dishes').innerHTML=list.length?list.map(dishCard).join(''):'<div class="empty">'+(kw?'没有找到相关菜品':'该类目菜品上架中，敬请期待')+'</div>';
}
function renderCartBar(){
  const items=Object.entries(cart).filter(([,q])=>q>0);
  const cnt=items.reduce((a,[,q])=>a+q,0);
  const total=items.reduce((a,[id,q])=>{const d=DISHES.find(x=>x.id==id);return d?a+Number(d.p)*q:a;},0);
  $('badge').style.display=cnt?'flex':'none';$('badge').textContent=cnt;
  $('ctotal').textContent='¥'+total.toFixed(1);
  const go=$('goBtn');
  if(!cnt){go.disabled=true;go.textContent='去结算';$('cnote').textContent='另需打包费¥2';}
  else if(total<20){go.disabled=true;go.textContent='还差¥'+(20-total).toFixed(1)+'起送';$('cnote').textContent='另需打包费¥2';}
  else{go.disabled=false;go.textContent='去结算';$('cnote').textContent='打包费¥2 ｜ 共¥'+(total+2).toFixed(1);}
}
function renderHeader(){
  $('stName').textContent=store.name;
  $('stTable').textContent=store.table;
}
function renderAll(){renderHeader();renderCats();renderDishes();renderCartBar();}
window.setCat=function(id){curCat=id;kw='';$('kw').value='';$('kwclear').style.display='none';renderAll();};
window.chg=function(id,delta){
  cart[id]=Math.max(0,(cart[id]||0)+delta);
  if(!cart[id])delete cart[id];
  renderDishes();renderCartBar();
};
$('kw').addEventListener('input',e=>{kw=e.target.value.trim();$('kwclear').style.display=kw?'flex':'none';renderCats();renderDishes();});
$('kwclear').onclick=()=>{$('kw').value='';kw='';$('kwclear').style.display='none';renderCats();renderDishes();};

document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>{
  if(editMode)return;
  document.querySelectorAll('.tabbar button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');$(b.dataset.pg).classList.add('on');
  if(b.dataset.pg==='pgOrders')renderOrders();
});

function cartItems(){return Object.entries(cart).filter(([,q])=>q>0).map(([id,q])=>({d:DISHES.find(x=>x.id==id),q})).filter(x=>x.d);}
function openCart(){
  const items=cartItems();
  const total=items.reduce((a,x)=>a+Number(x.d.p)*x.q,0);
  $('overlay').style.display='block';
  $('overlay').innerHTML='<div class="mask" onclick="closeOv(event)"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-h">购物车 <button class="clink" style="margin-left:auto;" onclick="clearCart()">清空</button></div><div class="sheet-b">'
  +(items.length?items.map(x=>'<div class="citem"><div style="flex:1;">'+esc(x.d.n)+'</div><div style="width:60px;text-align:right;" class="price">¥'+(Number(x.d.p)*x.q).toFixed(1)+'</div><div class="stepper"><button onclick="chg('+x.d.id+',-1);openCart()">'+icoMinus+'</button><span class="qty">'+x.q+'</span><button class="add" onclick="chg('+x.d.id+',1);openCart()">'+icoPlus+'</button></div></div>').join('')
    +'<div class="totline" style="margin-top:8px;"><span>打包费</span><span>¥2.0</span></div><div class="totline"><span>合计</span><span class="price" style="color:#1a1a1a;">¥'+(total+2).toFixed(1)+'</span></div>'
    :'<div class="empty">购物车是空的，去挑几样吧</div>')
  +'</div></div></div>';
}
window.clearCart=function(){cart={};closeOv();renderAll();};
window.closeOv=function(){$('overlay').style.display='none';$('overlay').innerHTML='';};
$('cartbar').querySelector('.ci').onclick=openCart;

$('goBtn').onclick=()=>{
  const items=cartItems();
  if(!items.length)return;
  const total=items.reduce((a,x)=>a+Number(x.d.p)*x.q,0);
  $('overlay').style.display='block';
  $('overlay').innerHTML='<div class="mask" onclick="closeOv(event)"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-h">确认订单<button class="clink" style="margin-left:auto;" onclick="closeOv()">关闭</button></div><div class="sheet-b">'
  +'<div class="totline"><span>送达地址</span><span style="color:#1a1a1a;">家和街12号</span></div>'
  +items.map(x=>'<div class="citem"><div style="flex:1;">'+esc(x.d.n)+' × '+x.q+'</div><div class="price">¥'+(Number(x.d.p)*x.q).toFixed(1)+'</div></div>').join('')
  +'<div class="totline"><span>打包费</span><span>¥2.0</span></div><div class="totline"><span>配送费</span><span>¥4.0</span></div><div class="totline"><span>合计</span><span class="price" style="color:#1a1a1a;">¥'+(total+6).toFixed(1)+'</span></div>'
  +'<button class="bigbtn" onclick="placeOrder()">确认下单</button></div></div></div>';
};
window.placeOrder=function(){
  const items=cartItems();
  const total=items.reduce((a,x)=>a+Number(x.d.p)*x.q,0);
  const o={no:'WD'+(Date.now()%1000000),items:items.map(x=>({n:x.d.n,q:x.q,p:Number(x.d.p)})),total:total+6,st:'待接单',t:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})};
  orders.unshift(o);cart={};save();renderAll();closeOv();showToast('下单成功，已通知后厨');
  setTimeout(()=>{o.st='制作中';save();},3000);
  setTimeout(()=>{o.st='已完成';save();},8000);
};
function showToast(t){const el=$('toast');el.textContent=t;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,1600);}

function renderOrders(){
  if(!orders.length){$('orders').innerHTML='<div class="empty">暂无订单<br>去点单页下一单试试吧</div>';return;}
  const stc={'待接单':['#b47909','rgba(240,160,32,.14)'],'制作中':['#3d7fff','rgba(61,127,255,.12)'],'已完成':['#30a46c','rgba(48,164,108,.12)']};
  $('orders').innerHTML=orders.map(o=>'<div class="ocard"><div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:13px;color:#9a9aa2;">'+o.no+' · '+o.t+'</span><span class="pill" style="color:'+stc[o.st][0]+';background:'+stc[o.st][1]+';">'+o.st+'</span></div><div style="margin:8px 0;">'
  +o.items.map(i=>'<div class="orow"><span>'+esc(i.n)+' × '+i.q+'</span><span>¥'+(Number(i.p)*i.q).toFixed(1)+'</span></div>').join('')
  +'</div><div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ececf0;padding-top:8px;"><span style="font-size:13px;color:#66666e;">实付 <span class="price" style="color:#1a1a1a;">¥'+o.total.toFixed(1)+'</span></span><button class="ghost" onclick="again(\''+o.no+'\')">再来一单</button></div></div>').join('');
}
window.again=function(no){
  const o=orders.find(x=>x.no===no);
  if(!o)return;
  o.items.forEach(i=>{const d=DISHES.find(x=>x.n===i.n);if(d)cart[d.id]=(cart[d.id]||0)+i.q;});
  renderAll();showToast('已加入购物车');
  document.querySelector('.tabbar button').click();
};

/* ========= 编辑模式 ========= */
window.toggleEdit=function(){
  editMode=!editMode;
  $('editBtn').textContent=editMode?'完成编辑':'编辑内容';
  $('menuView').style.display=editMode?'none':'flex';
  $('editView').classList.toggle('on',editMode);
  $('cartbar').style.visibility=editMode?'hidden':'visible';
  $('searchWrap').style.display=editMode?'none':'flex';
  document.querySelectorAll('.tabbar button').forEach(x=>x.style.opacity=editMode?.4:1);
  if(editMode)renderEdit();else{save();renderAll();showToast('已保存');}
};
$('editBtn').onclick=toggleEdit;

function renderEdit(){
  let h='<div class="elab">店铺名称</div><input class="einput" value="'+esc(store.name)+'" oninput="store.name=this.value;$(\'stName\').textContent=this.value;">';
  h+='<div class="elab">桌号</div><input class="einput" value="'+esc(store.table)+'" oninput="store.table=this.value;$(\'stTable\').textContent=this.value;">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;"><div style="font-weight:500;">分类与菜品</div><button class="ebtn" onclick="addCat()">＋ 添加分类</button></div>';
  CATS.forEach(c=>{
    h+='<div class="ecard"><div style="display:flex;gap:8px;align-items:center;"><input class="einput" style="font-weight:500;" value="'+esc(c.n)+'" oninput="renameCat(\''+c.id+'\',this.value)"><button class="edel" onclick="delCat(\''+c.id+'\')">删除分类</button></div>';
    DISHES.filter(d=>d.c===c.id).forEach(d=>{
      h+='<div class="edish">'
      +'<input class="einput" placeholder="菜品名称" value="'+esc(d.n)+'" oninput="dishField('+d.id+',\'n\',this.value)">'
      +'<input class="einput" placeholder="标签(选填,如:招牌)" value="'+esc(d.t||'')+'" oninput="dishField('+d.id+',\'t\',this.value)">'
      +'<input class="einput" placeholder="描述" value="'+esc(d.d||'')+'" oninput="dishField('+d.id+',\'d\',this.value)">'
      +'<div style="display:flex;gap:6px;align-items:center;"><input class="einput" type="number" step="0.1" placeholder="价格" value="'+d.p+'" oninput="dishField('+d.id+',\'p\',this.value)" style="flex:1;"><button class="edel" onclick="delDish('+d.id+')">删除</button></div>'
      +'</div>';
    });
    h+='<button class="ebtn" style="margin-top:10px;" onclick="addDish(\''+c.id+'\')">＋ 添加菜品</button></div>';
  });
  h+='<button class="edel" style="margin:4px 0 12px;" onclick="resetAll()">恢复默认数据</button>';
  h+='<div style="font-size:12px;color:#9a9aa2;">所有修改自动保存在浏览器本地（localStorage），刷新不丢失。</div>';
  $('editView').innerHTML=h;
}
window.renameCat=function(id,v){CATS.find(c=>c.id===id).n=v;save();};
window.dishField=function(id,f,v){const d=DISHES.find(x=>x.id===id);if(!d)return;if(f==='p'){d.p=parseFloat(v)||0;}else d[f]=v;save();};
window.addCat=function(){const id='c'+Date.now();CATS.push({id,n:'新分类'});save();renderEdit();};
window.delCat=function(id){if(!confirm('删除该分类及其所有菜品？'))return;CATS=CATS.filter(c=>c.id!==id);DISHES=DISHES.filter(d=>{if(d.c===id){delete cart[d.id];return false;}return true;});if(curCat===id)curCat=CATS.length?CATS[0].id:'';save();renderEdit();};
window.addDish=function(cid){DISHES.push({id:++dishSeq,c:cid,n:'新菜品',d:'',p:15.8,s:0,t:'',h:DISHES.length%5+1});save();renderEdit();};
window.delDish=function(id){if(!confirm('删除该菜品？'))return;DISHES=DISHES.filter(d=>d.id!==id);delete cart[id];save();renderEdit();};
window.resetAll=function(){
  if(!confirm('确定恢复默认数据？当前修改将丢失。'))return;
  localStorage.removeItem(LS_KEY);
  store.name=DEFAULTS.store.name;store.table=DEFAULTS.store.table;
  CATS=DEFAULTS.CATS.slice();DISHES=DEFAULTS.DISHES.slice();orders=[];cart={};
  curCat=CATS[0].id;save();renderEdit();renderHeader();
};

renderAll();
</script>
</body>
</html>
